# One-click deploy on Render (free plan): New + > Blueprint > pick this repository.
services:
  - type: web
    name: bloodlink-rwanda
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      - key: SESSION_SECRET
        generateValue: true
      # Leave both empty and create the admin account yourself on /signup
      # after the first deploy. Set them only if you prefer the account to be
      # created at start-up instead.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
