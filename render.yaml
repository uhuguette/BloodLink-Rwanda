# One-click deploy on Render (free plan): New + > Blueprint > pick this repository.
#
# The free plan has no persistent disk. The instance also spins down after about
# 15 minutes without visitors, and the filesystem is wiped every time it starts
# again or redeploys. So data/bloodlink.db does not survive: the donor list and
# the admins table both come back empty.
#
# That is why ADMIN_USERNAME and ADMIN_PASSWORD are filled in here. They are
# asked for once, when you click Apply, and the admin account is recreated from
# them on every cold start. Without them the site would come back with no admin
# at all, your login would stop working, and /signup would reopen to whoever
# visited next.
#
# SEED_DEMO=true reloads the 30 sample donors after each restart for the same
# reason, so the site is never empty when somebody opens it.
services:
  - type: web
    name: bloodlink-rwanda
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 20.11.0
      # A new random value, generated by Render and never stored in this file.
      - key: SESSION_SECRET
        generateValue: true
      # Render asks you for these two on Apply. Use the username and password
      # you want to log in with: 8 characters or more for the password.
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SEED_DEMO
        value: "true"
